name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pytest==9.1.1 ruff==0.17.2
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
