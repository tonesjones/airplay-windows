[project]
name = "airmirror"
version = "0.1.0"
description = "Mirror the Windows desktop to an AirPlay TV through open-airplay"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
